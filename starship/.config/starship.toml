add_newline = false
format = "$all$fill$cmd_duration$status$line_break$character"

[profiles]
transient = "$character"
rtransient = ""

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"
vimcmd_replace_one_symbol = "[<](purple)"
vimcmd_replace_symbol = "[<](purple)"
vimcmd_visual_symbol = "[<](yellow)"

[directory]
style = "blue"

[git_status]
style = "red"
ahead = ">"
behind = "<"
deleted = "x"

[status]
symbol = "[x](red) "

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"

[fill]
symbol = " "
